[theme]
base = "light"
primaryColor = "#087F8C"
backgroundColor = "#F4F8FA"
secondaryBackgroundColor = "#EAF0F5"
textColor = "#142B40"
linkColor = "#08616B"
borderColor = "#D8E5E8"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "16px"
buttonRadius = "full"
font = "'IBM Plex Sans Arabic':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
headingFont = "'IBM Plex Sans Arabic':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap"
baseFontSize = 16
headingFontSizes = ["36px", "27px", "21px", "18px", "15px", "13px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
linkUnderline = false
chartCategoricalColors = ["#087F8C", "#142B40", "#20B5AD", "#647B8C", "#A8DADC", "#07515B"]
chartSequentialColors = ["#F0FAFA", "#E1F4F3", "#C8E9E7", "#AADCD8", "#7AC6C1", "#42ADA9", "#087F8C", "#086A75", "#07515B", "#063D48"]
greenColor = "#16794A"
greenBackgroundColor = "#E1F3E9"
greenTextColor = "#0C5130"
orangeColor = "#087F8C"
orangeBackgroundColor = "#FFF0E6"
orangeTextColor = "#9A3300"
redColor = "#B42318"
redBackgroundColor = "#FDE7E5"
redTextColor = "#7A1710"
blueColor = "#3C6478"
blueBackgroundColor = "#E8F0F4"
blueTextColor = "#244454"
dataframeBorderColor = "#D8E5E8"
dataframeHeaderBackgroundColor = "#EAF0F5"

[theme.sidebar]
backgroundColor = "#142B40"
secondaryBackgroundColor = "#203E53"
textColor = "#FFFFFF"
primaryColor = "#087F8C"
borderColor = "#365569"

[server]
headless = true
runOnSave = true

[client]
showErrorDetails = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
