[theme]
base = "light"
primaryColor = "#E95B0C"
backgroundColor = "#FCFBFA"
secondaryBackgroundColor = "#F4F1EE"
textColor = "#171513"
linkColor = "#C94700"
borderColor = "#DED7D1"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "16px"
buttonRadius = "full"
font = "'IBM Plex Sans Arabic':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
headingFont = "'IBM Plex Sans Arabic':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap"
baseFontSize = 16
headingFontSizes = ["36px", "27px", "21px", "18px", "15px", "13px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
linkUnderline = false
chartCategoricalColors = ["#E95B0C", "#111111", "#F39252", "#6B625C", "#FFC49E", "#A83A00"]
chartSequentialColors = ["#FFF7F1", "#FFE9DA", "#FFD8C0", "#FFC29B", "#FBAA74", "#F48D4A", "#E95B0C", "#CB4700", "#A83700", "#742600"]
greenColor = "#16794A"
greenBackgroundColor = "#E1F3E9"
greenTextColor = "#0C5130"
orangeColor = "#E95B0C"
orangeBackgroundColor = "#FFF0E6"
orangeTextColor = "#9A3300"
redColor = "#B42318"
redBackgroundColor = "#FDE7E5"
redTextColor = "#7A1710"
blueColor = "#3C6478"
blueBackgroundColor = "#E8F0F4"
blueTextColor = "#244454"
dataframeBorderColor = "#DED7D1"
dataframeHeaderBackgroundColor = "#F1ECE8"

[theme.sidebar]
backgroundColor = "#111111"
secondaryBackgroundColor = "#24211F"
textColor = "#FFFFFF"
primaryColor = "#E95B0C"
borderColor = "#342E2A"

[server]
headless = true
runOnSave = true

[client]
showErrorDetails = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
